<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="DICOM RT Plan Delivery Simulator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#102A43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g opacity="0.10" stroke="#ffffff" stroke-width="1">
    <path d="M0 60H1200"/><path d="M0 120H1200"/><path d="M0 180H1200"/><path d="M0 240H1200"/><path d="M0 300H1200"/><path d="M0 360H1200"/>
    <path d="M80 0V420"/><path d="M160 0V420"/><path d="M240 0V420"/><path d="M320 0V420"/><path d="M400 0V420"/><path d="M480 0V420"/>
    <path d="M560 0V420"/><path d="M640 0V420"/><path d="M720 0V420"/><path d="M800 0V420"/><path d="M880 0V420"/>
    <path d="M960 0V420"/><path d="M1040 0V420"/><path d="M1120 0V420"/>
  </g>

  <!-- card -->
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="1060" height="280" rx="18" fill="#0F172A" stroke="#1F2A44"/>
    <rect x="70" y="70" width="1060" height="6" fill="url(#accent)"/>
  </g>

  <!-- icon -->
  <g transform="translate(120,130)">
    <rect x="0" y="0" width="120" height="120" rx="18" fill="#111C33" stroke="#1F2A44"/>
    <path d="M26 40h68" stroke="#93C5FD" stroke-width="8" stroke-linecap="round"/>
    <path d="M26 62h54" stroke="#93C5FD" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <path d="M26 84h60" stroke="#93C5FD" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <circle cx="92" cy="84" r="12" fill="#22C55E" opacity="0.9"/>
  </g>

  <!-- text -->
  <g fill="#E5E7EB" font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="280" y="165" font-size="40" font-weight="700">DICOM RT Plan Delivery Simulator</text>
    <text x="280" y="210" font-size="20" opacity="0.9">Web-based BEV visualization • kinematics-limited delivery simulation • complexity metrics</text>
    <text x="280" y="250" font-size="18" opacity="0.75">Drag-and-drop RTPLAN / RTSTRUCT and explore control points, device limits, and time-series plots.</text>
  </g>

  <!-- accent line -->
  <rect x="280" y="275" width="560" height="8" rx="4" fill="url(#accent)" opacity="0.9"/>

  <!-- footer note -->
  <g fill="#CBD5E1" font-family="Segoe UI, Inter, Arial, sans-serif" opacity="0.75">
    <text x="70" y="395" font-size="14">README visuals (SVG) are placeholders you can replace with real screenshots.</text>
  </g>
</svg>
