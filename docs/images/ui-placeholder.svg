<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="UI screenshot placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <style>
      .frame{fill:#0F172A;stroke:#23314E;stroke-width:2}
      .top{fill:#111C33;stroke:#23314E;stroke-width:2}
      .text{fill:#E5E7EB;font:600 22px Segoe UI,Inter,Arial,sans-serif}
      .muted{fill:#94A3B8;font:16px Segoe UI,Inter,Arial,sans-serif}
      .dash{stroke:#22C55E;stroke-width:4;stroke-dasharray:10 10;fill:none}
      .chip{fill:#111C33;stroke:#23314E;stroke-width:2}
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>

  <g transform="translate(70,70)">
    <rect class="frame" width="1060" height="580" rx="18"/>
    <rect class="top" x="0" y="0" width="1060" height="56" rx="18"/>
    <circle cx="28" cy="28" r="8" fill="#EF4444"/>
    <circle cx="52" cy="28" r="8" fill="#F59E0B"/>
    <circle cx="76" cy="28" r="8" fill="#22C55E"/>

    <text class="text" x="120" y="36">Screenshot Placeholder</text>

    <rect class="chip" x="30" y="90" width="340" height="200" rx="14"/>
    <rect class="chip" x="400" y="90" width="630" height="200" rx="14"/>
    <rect class="chip" x="30" y="320" width="1000" height="300" rx="14"/>

    <rect class="dash" x="30" y="90" width="1000" height="530" rx="16"/>

    <text class="text" x="80" y="420">Replace this image with a real UI screenshot</text>
    <text class="muted" x="80" y="452">Recommended: 1200×720 PNG or SVG export</text>
    <text class="muted" x="80" y="484">Path: docs/images/ui.png (then update README)</text>
  </g>
</svg>
